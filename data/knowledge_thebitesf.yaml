  address: "996 Mission St, San Francisco, CA 94103"
  phone: "415-757-0414"
  email: "info@thebitesf.com"
  website: "thebitesf.com"
  ordering: "Visit us in person, order online at thebitesf.com, or call us during opening hours"
  services: "Online ordering and catering available"

business_hours:
  timezone: "America/Los_Angeles"
  schedule:
    - days: [Sunday]
